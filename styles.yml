# ============================================================================
# styles.yml — 摄影风格库
# ----------------------------------------------------------------------------
# 摄影类型繁多，类型相关的建议与禁忌统一记录在本文件中，严禁修改skill.md。
#
# 扩展方法：需要支持新类型时，在 styles 下新增一个条目（key 用英文，
# 填写 name / match / guidance）；某类型的细则太多时，可以把它们写进一个
# 单独的 markdown 文档，并在该条目下用 doc 字段指向它（路径相对本文件）。
# ============================================================================

usage: |
  修图前按以下步骤使用本文件：
  1. 判断照片类型：观察画面内容，可结合 EXIF（焦段、光圈、ISO、拍摄时间）辅助判断。
  2. 与 styles 中各条目的 match 字段对照，找到匹配的类型；可能同时命中多个类型
     （如"夜景人像"同时匹配 portrait 与 night），此时合并遵循所有命中条目的 guidance，
     冲突时以更具体的类型为准。
  3. 严格遵循命中条目的 guidance（其中包含这类照片的建议与禁忌）。
     若命中条目带有 doc 字段，先完整阅读该文档再动手。
  4. 没有任何条目匹配时，按 skill.md 的通用准则处理，不要硬套某种风格。

styles:
  portrait:
    name: 人像摄影 (Portrait)
    match: 画面主体是人，如特写、半身、全身、婚纱写真、儿童、街拍人像等
    guidance: |
      - 肤色优先：主动调整曝光/色温使肤色好看。健康肤色标准：histogram 通道均值
        R > G > B 且 R 明显高于 B；脸部高光不死白、暗部不发灰。
        常见问题与对应参数（可直接套用再微调）：
        - 肤色偏暗、画面发灰：--exposure 0.3 --shadow 15
        - 肤色偏冷发青：--temperature 8 --tint 5
        - 额头/鼻梁高光死白：--highlight -25
        - 肤色偏黄显疲惫：--temperature -6 --tint 3 --saturation -5
      - 主动询问：调整完肤色后，询问用户是否需要处理脸部瑕疵（痘痘、痣、皱纹、
        油光、黑眼圈）。不要未经询问就直接磨皮/祛斑，也不要漏问。
      - 先看脸再动局部：处理瑕疵前必须先看清楚脸——把脸部区域 crop 到临时文件
        放大观察（或 inspect --width 100 看缩略图），确认瑕疵位置并估算归一化坐标后：
        - 痘痘/痣/小污点：heal --spot x,y,r 逐点修复，r 取 0.005~0.015
        - 油光（额头、鼻尖亮斑）：local --cx .. --cy .. --radius 0.05 --highlight -20
        - 磨皮：local --radius 0.15~0.3 --blur 2~5 --feather 0.6，只圈皮肤区域，
          避开眼睛、嘴唇、发丝和轮廓边缘，否则会假；做完后再放大复查，确认
          没有塑料感或残留瑕疵。
      - 调色禁忌：禁止把建筑/城市向影调套在人像上——teal-orange（青橙）、cold-gray
        （冷灰）、cinematic 等是为建筑、街景、夜景设计的，套在人像上会让肤色
        发脏发橘或发灰发青。人像优先选 warm、golden-hour 等肤色友好预设
        （以 list-presets 中各预设的 scene 描述为准），除非用户明确点名要某种风格。

  landscape:
    name: 风光摄影 (Landscape)
    match: 自然风景为主，如山川、湖泊、森林、田野、海岸、天空云霞等，人物最多作点缀
    guidance: |
      - 先看主题：确认主体是什么（山、湖、建筑、林间、人物点缀……），一切裁切与
        调整围绕强化主体进行。
      - 构图美学与合理裁切（经典构图思路，按画面选用）：
        - 三分法：地平线放在上/下三分线上（如 --top 0 --bottom 0.66），主体放在
          三分线交点附近，避免居中呆板（对称建筑、倒影除外）。
        - 引导线：道路、河流、栏杆、光束应指向主体，裁掉偏离主体的杂乱线条。
        - 前景-中景-背景：保留有层次价值的前景（岩石、花丛、枝条）增强纵深，
          不要裁掉关键前景。
        - 留白与视线方向：主体运动方向或视线朝向的一侧留更多空间。
        - 地平线必须水平：倾斜先裁正。
        - 清理边缘：裁掉半截的树枝、路人、垃圾桶、电线等边缘干扰物。
        - 天空取舍：天空乏味（死白或灰蒙蒙）且占比超过一半时果断裁掉部分天空；
          天空精彩（云霞、丁达尔光）则让它占上三分之二。
      - 丁达尔光（增强光线感）：画面需要光线氛围时——逆光树林、晨雾、空气中有
        灰尘/水汽、窗光、云隙——可用 tyndall 增强。要点：
        - 光源位置必须与画面已有光影方向一致（如太阳所在处、天空最亮处），
          方向穿帮会立刻假。
        - 强度从 --strength 0.4 起步，宁轻勿重；暖调光线配 --warmth 0.7 左右更自然。
        - 应用后拉开距离观察整体，光束若显得突兀就降强度或减小 --length。

  architecture:
    name: 建筑与城市 (Architecture & City)
    match: 建筑外观、室内空间、玻璃幕墙、桥梁、城市天际线、极简几何结构等
    guidance: |
      - 线条要正：建筑摄影中垂直线歪斜会很扎眼；本工具没有透视校正，倾斜明显时
        先用 crop 裁正构图，必要时告知用户局限。
      - 保留结构感：适度提高对比度（--contrast 10~20）突出线条与几何；避免过度
        提亮阴影导致画面发灰。
      - 调色：teal-orange、cold-gray、cinematic 等冷峻影调正适合建筑/城市题材。
      - 用 crop 清理画面边缘的脚手架、电线、路人等干扰物。

  night:
    name: 夜景 (Night)
    match: 夜晚户外场景，如城市夜景、霓虹灯、车流、星空、灯光照明的建筑等
    guidance: |
      - 噪点常见：夜景多用高 ISO，先查 EXIF 与直方图暗部，噪点明显先 denoise
        再做其他调整。
      - 高光控制优先：灯光、霓虹容易死白，压高光（--highlight -20 ~ -40）保留
        灯牌与光源细节。
      - 调色：teal-orange、cinematic 与夜景霓虹很搭；注意暗部不要压成死黑一片。

  food:
    name: 美食摄影 (Food)
    match: 菜品、食材、饮品、餐桌场景的俯拍或特写
    guidance: |
      - 暖调诱人：优先 warm 预设或轻微 --temperature 5~15，让食物显得温热新鲜。
      - 提亮但保细节：适度 --exposure 0.2~0.4，配合 --highlight -10，避免高光把
        汤汁、釉面打成死白。
      - 饱和度宁轻勿重：食物色彩溢出会显得假，--saturation 5~15 足够。
      - 可用 local 径向提亮食物主体、压暗四周，突出菜品。

  street:
    name: 街头纪实 (Street)
    match: 街头抓拍、人文纪实、市井生活，通常有人物但以环境叙事为主
    guidance: |
      - 真实感优先：少用重特效；tyndall、重度磨皮这类操作容易破坏纪实质感，默认不做。
      - 保持自然影调：对比度与饱和度微调即可；强光影街头适合黑白（noir），
        但需用户明确想要黑白时再用。
      - 裁掉边缘干扰物，但不要为了"完美"裁掉画面中的叙事要素。

  wildlife:
    name: 生态/野生动物 (Wildlife)
    match: 野生动物、鸟类、宠物、昆虫等以动物为主体的画面
    guidance: |
      - 主体清晰：动物（尤其眼睛）必须锐利，不要对主体做模糊、柔化类操作。
      - 长焦高 ISO 噪点常见：先查 EXIF，噪点明显先 denoise，但避免过度降噪把
        毛发/羽毛质感抹平。
      - 背景干扰用 crop 或 local 压暗/虚化处理，突出主体。
